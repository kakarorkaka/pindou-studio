<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼豆工作室 · 图片转拼豆图纸</title>
<meta name="description" content="上传照片，生成可打印的拼豆图纸：真实品牌色号、行列坐标、购物清单。所有处理都在本机完成，图片不会上传。">
<meta name="theme-color" content="#F6F4EF">
<meta property="og:type" content="website">
<meta property="og:title" content="拼豆工作室 · 图片转拼豆图纸">
<meta property="og:description" content="上传照片，生成可打印的拼豆图纸：真实品牌色号、行列坐标、购物清单。所有处理在本机完成。">
<meta property="og:image" content="https://kakarorkaka.github.io/pindou-studio/docs/screenshots/workspace-desktop.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============================ 首页 ============================ -->
  <section class="view view-home" id="viewHome">
    <header class="home-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="brand-name serif">拼豆工作室</span>
      </div>
      <button class="link-btn only-desktop" id="sampleTop">示例图 →</button>
    </header>

    <main class="home-main">
      <h1 class="hero-title serif">把一张图，<br>变成一张图纸。</h1>
      <p class="hero-sub">上传照片，立即得到可打印的拼豆图纸。<br>所有处理都在本机完成，图片不会上传。</p>

      <!-- 上传区 -->
      <div class="upload-card" id="uploadCard" role="button" tabindex="0"
           aria-label="上传图片，支持 JPG PNG WEBP，20MB 以内">
        <div class="upload-empty" id="uploadEmpty">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="2.2"/>
            <circle cx="8.6" cy="9.6" r="1.4"/>
            <path d="M3.6 17.2l4.6-4.6 3.4 3.4 2.7-2.7 5.9 5.9"/>
          </svg>
          <div class="upload-title">选择图片</div>
          <div class="upload-sub">拖拽到这里，或点击上传</div>
          <div class="upload-spec">JPG · PNG · WEBP · 20MB 以内</div>
        </div>
        <div class="upload-preview hidden" id="uploadPreview">
          <img id="uploadThumb" alt="已上传图片预览">
          <div class="upload-file">
            <div class="upload-name" id="uploadName">—</div>
            <div class="upload-dim" id="uploadDim"></div>
          </div>
          <div class="upload-actions">
            <button class="btn btn-ghost" id="changeImageBtn" type="button">更换</button>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      </div>

      <div class="sample-line">
        <button class="link-btn" id="sampleBtn" type="button">用示例图试试 →</button>
      </div>

      <div class="trust-row" aria-hidden="true">
        <span>本地处理</span><i></i><span>真实品牌色号</span><i></i><span>可打印</span>
      </div>

      <!-- 校准卡（选图后出现） -->
      <section class="calibrate hidden" id="calibrate" aria-label="图纸设置">
        <div class="calibrate-head">
          <h2 class="serif">选择图纸规格</h2>
          <span class="calibrate-note">默认即可，之后还能改</span>
        </div>

        <div class="field-group">
          <div class="field-label">尺寸 <span class="field-hint">影响细节与用豆量</span></div>
          <div class="preset-row" id="homePresets"></div>
          <div class="custom-size hidden" id="homeCustom">
            <input type="number" id="homeCustomInput" min="8" max="400" step="1" inputmode="numeric" aria-label="自定义网格宽度">
            <span>格宽</span>
          </div>
        </div>

        <div class="field-row">
          <label class="field-group">
            <span class="field-label">豆子品牌</span>
            <select class="select" id="homeBrand">
              <option value="MARD">MARD（推荐）</option>
              <option value="COCO">COCO</option>
              <option value="漫漫">漫漫</option>
              <option value="盼盼">盼盼（纯数字色号）</option>
              <option value="咪小窝">咪小窝（纯数字）</option>
            </select>
          </label>
          <label class="field-group">
            <span class="field-label">颜色数</span>
            <select class="select" id="homeColors">
              <option value="8">8 色</option>
              <option value="12">12 色</option>
              <option value="16" selected>16 色（推荐）</option>
              <option value="24">24 色</option>
              <option value="32">32 色</option>
              <option value="205">不限</option>
            </select>
          </label>
        </div>

        <p class="estimate-line" id="homeEstimate"></p>

        <button class="btn btn-primary btn-block" id="generateBtn" type="button">
          生成图纸
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6.5L18.5 12 13 17.5"/></svg>
        </button>

        <div class="calibrate-foot">
          <button class="link-btn" id="homeAdvancedBtn" type="button">更多参数 →</button>
          <span class="calibrate-tip">图片不会上传</span>
        </div>
      </section>
    </main>
  </section>

  <!-- ============================ 工作台 ============================ -->
  <section class="view view-workspace hidden" id="viewWorkspace">
    <header class="ws-head">
      <button class="icon-btn" id="backBtn" type="button" aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
      </button>
      <div class="ws-titles">
        <input class="ws-title serif" id="titleInput" placeholder="未命名作品" aria-label="作品名" maxlength="40">
        <div class="ws-meta" id="wsMeta"></div>
      </div>
      <div class="ws-actions">
        <button class="icon-btn" id="undoBtn" type="button" aria-label="撤销" title="撤销 ⌘Z">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 010 10h-2"/></svg>
        </button>
        <button class="icon-btn" id="redoBtn" type="button" aria-label="重做" title="重做 ⇧⌘Z">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 7l4 4-4 4"/><path d="M19 11h-9a5 5 0 000 10h2"/></svg>
        </button>
        <button class="btn btn-ghost only-desktop" id="changeBtn" type="button">更换图片</button>
        <button class="btn btn-primary btn-sm" id="exportBtn" type="button">
          导出图纸
        </button>
      </div>
    </header>

    <div class="ws-body">
      <div class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="tool-group only-desktop" role="group" aria-label="绘图工具">
            <button class="tool-btn" data-tool="brush" type="button" aria-label="画笔 B" title="画笔 B">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 4.5l4 4-9.2 9.2-4-4z"/><path d="M6.3 13.7L3.5 20.5l6.8-2.8"/></svg>
              <span>画笔</span>
            </button>
            <button class="tool-btn" data-tool="eraser" type="button" aria-label="橡皮 E" title="橡皮 E">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.8 15.2l6.4-6.4 5.1 5.1-6.4 6.4H6.6z"/><path d="M14.6 5.4l3 3"/></svg>
              <span>橡皮</span>
            </button>
            <button class="tool-btn" data-tool="eyedropper" type="button" aria-label="取色 I" title="取色 I">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18.5 5.5l-9 9"/><path d="M19.5 4.5l-2 2"/><path d="M10.2 14.8l-1.4 1.4a2.2 2.2 0 01-3.1 0l-.9-.9a2.2 2.2 0 010-3.1l1.4-1.4"/></svg>
              <span>取色</span>
            </button>
            <button class="tool-btn" data-tool="hand" type="button" aria-label="移动 H" title="移动 H">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11V5.5a1.5 1.5 0 013 0V11"/><path d="M12 11V4.5a1.5 1.5 0 013 0V11"/><path d="M15 11V6.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-6-6v-2.5a1.5 1.5 0 013 0V13"/></svg>
              <span>移动</span>
            </button>
          </div>

          <div class="display-group" role="group" aria-label="显示选项">
            <label class="chip-check"><input type="checkbox" data-display="code" checked><span>色号</span></label>
            <label class="chip-check"><input type="checkbox" data-display="grid" checked><span>网格</span></label>
            <label class="chip-check"><input type="checkbox" data-display="board"><span>钉板线</span></label>
            <label class="chip-check"><input type="checkbox" data-display="coords" checked><span>坐标</span></label>
          </div>

          <div class="spacer"></div>

          <div class="zoom-group" role="group" aria-label="缩放">
            <button class="icon-btn" id="zoomOut" type="button" aria-label="缩小">−</button>
            <input type="range" id="zoomRange" min="6" max="36" step="1" value="16" aria-label="缩放比例">
            <button class="icon-btn" id="zoomIn" type="button" aria-label="放大">+</button>
            <button class="btn btn-ghost btn-fit" id="fitBtn" type="button">适应窗口</button>
            <span class="zoom-label" id="zoomLabel">16px</span>
          </div>
        </div>

        <div class="canvas-viewport" id="canvasViewport">
          <canvas id="patternCanvas" aria-label="拼豆图纸预览"></canvas>
        </div>

        <div class="canvas-foot">
          <span class="cost" id="costLine"></span>
          <span class="hint only-desktop" id="canvasHint">空格 + 拖动平移 · 右键擦除 · ⌘Z 撤销</span>
        </div>
      </div>

      <!-- 桌面检查器 -->
      <aside class="inspector only-desktop" id="inspector" aria-label="图纸设置">
        <div class="inspector-scroll" id="settingsDesktop"></div>
      </aside>
    </div>

    <!-- 移动端底栏 -->
    <nav class="mobile-toolbar" id="mobileToolbar" aria-label="绘图工具">
      <button class="tool-btn" data-tool="brush" type="button" aria-label="画笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 4.5l4 4-9.2 9.2-4-4z"/><path d="M6.3 13.7L3.5 20.5l6.8-2.8"/></svg>
        <span>画笔</span>
      </button>
      <button class="tool-btn" data-tool="eraser" type="button" aria-label="橡皮">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.8 15.2l6.4-6.4 5.1 5.1-6.4 6.4H6.6z"/><path d="M14.6 5.4l3 3"/></svg>
        <span>橡皮</span>
      </button>
      <button class="tool-btn" data-tool="eyedropper" type="button" aria-label="取色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18.5 5.5l-9 9"/><path d="M19.5 4.5l-2 2"/><path d="M10.2 14.8l-1.4 1.4a2.2 2.2 0 01-3.1 0l-.9-.9a2.2 2.2 0 010-3.1l1.4-1.4"/></svg>
        <span>取色</span>
      </button>
      <button class="tool-btn" data-tool="hand" type="button" aria-label="移动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11V5.5a1.5 1.5 0 013 0V11"/><path d="M12 11V4.5a1.5 1.5 0 013 0V11"/><path d="M15 11V6.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-6-6v-2.5a1.5 1.5 0 013 0V13"/></svg>
        <span>移动</span>
      </button>
      <button class="tool-btn" id="legendBtn" type="button" aria-label="图例">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="4" height="4" rx="1"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 7h9M11 17h9"/></svg>
        <span>图例</span>
      </button>
      <button class="tool-btn" id="settingsBtn" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M5.9 5.9l1.4 1.4M16.7 16.7l1.4 1.4M18.1 5.9l-1.4 1.4M7.3 16.7l-1.4 1.4"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </section>
</div>

<!-- ============================ 浮层 ============================ -->
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheetExport" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
  <div class="sheet-head">
    <h2 class="serif" id="exportTitle">导出图纸</h2>
    <button class="icon-btn" data-close type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <label class="field-group">
      <span class="field-label">清晰度</span>
      <select class="select" id="exportCell">
        <option value="16">16px / 格（轻量）</option>
        <option value="24" selected>24px / 格（推荐）</option>
        <option value="32">32px / 格（高清）</option>
        <option value="48">48px / 格（打印）</option>
      </select>
    </label>
    <p class="sheet-note" id="exportContents">包含：标题 · 坐标 · 色号 · 图例 · 统计</p>

    <button class="btn btn-primary btn-block" id="exportPng" type="button">导出 PNG 图纸</button>
    <div class="sheet-actions">
      <button class="btn btn-ghost btn-block" id="exportPrint" type="button">打印图纸（100% 缩放）</button>
      <button class="btn btn-ghost btn-block" id="exportCsv" type="button">购物清单 CSV</button>
    </div>
    <p class="sheet-tip">A4 纸可放下约 29×29 格的图纸；更大请用 A3 或分页打印。打印时请选择 100% 缩放。</p>
  </div>
</section>

<section class="sheet" id="sheetSettings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="sheet-head">
    <h2 class="serif" id="settingsTitle">图纸设置</h2>
    <button class="icon-btn" data-close type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="settingsMobile"></div>
</section>

<section class="sheet" id="sheetLegend" role="dialog" aria-modal="true" aria-labelledby="legendTitle" hidden>
  <div class="sheet-head">
    <h2 class="serif" id="legendTitle">图例与颜色</h2>
    <button class="icon-btn" data-close type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="legend-head"><span id="legendSheetCount">—</span><button class="link-btn" id="restoreAllBtn" type="button">恢复全部</button></div>
    <div class="legend-list" id="legendListMobile"></div>
  </div>
</section>

<section class="sheet" id="sheetAdvanced" role="dialog" aria-modal="true" aria-labelledby="advancedTitle" hidden>
  <div class="sheet-head">
    <h2 class="serif" id="advancedTitle">高级参数</h2>
    <button class="icon-btn" data-close type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="advancedMobile"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button class="toast-undo hidden" id="toastUndo" type="button">撤销</button>
</div>

<div id="printArea"><img id="printImg" alt="拼豆图纸打印版"></div>
<pre id="selftestResult" hidden></pre>

<script src="js/colorData.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
